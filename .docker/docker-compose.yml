services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: "${COMPOSE_PROJECT_NAME}-symfony"
        restart: unless-stopped
        volumes:
            - ../:/var/www/app
            - ../../symfony-module-maker:/var/www/symfony-module-maker
            - ./php.ini:/usr/local/etc/php/conf.d/zz-dev.ini
            - shared-sessions:/tmp/sessions
        networks:
            - my-network
        depends_on:
            - nginx
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            PHP_IDE_CONFIG: serverName=DockerSymfony

    postgres:
        image: postgres:16-alpine
        container_name: "${COMPOSE_PROJECT_NAME}-postgres"
        restart: unless-stopped
        environment:
            POSTGRES_DB: booking_symfony
            POSTGRES_USER: booking
            POSTGRES_PASSWORD: booking
        ports:
            - "54320:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - my-network

    redis:
        image: redis:7-alpine
        container_name: "${COMPOSE_PROJECT_NAME}-redis"
        restart: unless-stopped
        ports:
            - "63790:6379"
        networks:
            - my-network

    nginx:
        image: nginx:alpine
        container_name: "${COMPOSE_PROJECT_NAME}-nginx"
        restart: unless-stopped
        ports:
            - "127.0.0.1:10020:80"
        volumes:
            - ../:/var/www/app
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - my-network

networks:
    my-network:
        external: true
        name: booking_my-network

volumes:
    postgres-data:
    shared-sessions:
        external: true
        name: booking_shared-sessions
